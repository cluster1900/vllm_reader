name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout vllm_reader
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout pinned upstream vLLM as sibling ../vllm
        run: |
          set -euo pipefail
          PIN="$(python3 -c "import json; print(json.load(open('meta/chapter-source-map.json'))['source_commit'])")"
          echo "Pinned source_commit=${PIN}"
          if ! printf '%s' "${PIN}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "source_commit must be a 40-char SHA" >&2
            exit 1
          fi
          # check_book.py resolves source_path ../vllm relative to reader root.
          # actions/checkout cannot place a repo outside GITHUB_WORKSPACE, so clone sibling via git.
          DEST="${GITHUB_WORKSPACE}/../vllm"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          git init "${DEST}"
          git -C "${DEST}" remote add origin https://github.com/vllm-project/vllm.git
          git -C "${DEST}" fetch --depth 1 origin "${PIN}"
          git -C "${DEST}" checkout --force FETCH_HEAD
          ACTUAL="$(git -C "${DEST}" rev-parse HEAD)"
          echo "Checked out ${ACTUAL}"
          test "${ACTUAL}" = "${PIN}"
          test -f "${DEST}/vllm/__init__.py"

      - name: unit tests
        run: python3 -m unittest discover -s tests

      - name: enrich_pedagogy --check
        run: python3 scripts/enrich_pedagogy.py --check

      - name: check_book.py
        run: python3 scripts/check_book.py

      # The steps below build the EPUB and the formula preview exactly as a reader
      # would, so that anything Pandoc/MathJax/Mermaid cannot render (for example
      # Chinese inside \text{} in a formula) fails the PR instead of the next release.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Pandoc 3.9
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/pandoc.deb" \
            https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-1-amd64.deb
          # sha256 of pandoc-3.9-1-amd64.deb (matches the digest GitHub lists for the asset)
          echo "f95d6e280da0daec1297bc2608bd537de563eadc31b56088d258532abcd257f4  ${RUNNER_TEMP}/pandoc.deb" | sha256sum -c -
          sudo dpkg -i "${RUNNER_TEMP}/pandoc.deb"
          pandoc --version | head -n 1

      - name: Install Mermaid CLI and MathJax
        run: pnpm install --frozen-lockfile

      - name: Point Mermaid CLI at the runner's Chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome)"
          echo "Using ${CHROME}: $("${CHROME}" --version)"
          # epub/puppeteer-config.json in the repo points at macOS Chrome; rewrite it
          # in this CI workspace only (nothing is committed).
          printf '{"executablePath":"%s","args":["--no-sandbox","--disable-dev-shm-usage"]}\n' "${CHROME}" \
            > epub/puppeteer-config.json

      - name: Build EPUB and validate it (build_epub.py runs check_epub.py)
        run: python3 scripts/build_epub.py

      - name: Build formula preview (Pandoc MathML vs MathJax SVG)
        run: python3 scripts/build_math_preview.py
